name: Update Job Data
run-name: "Job tracker · ${{ inputs.report_date || 'freshness check' }}"

on:
  schedule:
    # Read-only freshness check at 15:17 Asia/Shanghai.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Completed Asia/Shanghai date, YYYY-MM-DD"
        required: true
        type: string
      aggregate:
        description: "Validated daily aggregate JSON (schema v1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: job-tracker-daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.PAGES_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check data freshness
        if: github.event_name == 'schedule'
        run: python .github/scripts/update_job_data_direct.py --check-freshness
      - name: Validate and import daily aggregate
        if: github.event_name == 'workflow_dispatch'
        id: update
        run: python .github/scripts/update_job_data_direct.py
      - name: Commit and publish accepted data
        if: github.event_name == 'workflow_dispatch'
        env:
          REPORT_DATE: ${{ steps.update.outputs.update_date }}
        run: |
          if git diff --quiet -- job-tracker/data/job-data.json && [ -z "$(git ls-files --others --exclude-standard job-tracker/data/ingestion)" ]; then
            echo "Identical aggregate already published"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job-tracker/data/job-data.json job-tracker/data/ingestion
          git commit -m "Update job data ${REPORT_DATE} from daily aggregate"
          git push origin HEAD:master
